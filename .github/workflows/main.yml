name: Publish Package to npmjs

on:
  push:
    branches:
      - release
  workflow_dispatch:              # lets you trigger a manual test run

permissions:
  id-token: write                 # REQUIRED for OIDC
  contents: write                 # REQUIRED to create the version tag and GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'                          # 22.14.0+ is the floor
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false                # don't cache in release builds

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest                # ensures npm >= 11.5.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup git identity
        run: |
          git config --global user.email "github@digitalsamba.com"
          git config --global user.name "Digital Samba"

      - name: Set Yarn version
        run: corepack prepare yarn@3.1.0 --activate

      - name: Install dependencies
        run: yarn

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v heading="## [v${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/release-notes.md"; then
            echo "::error::No entry for v${VERSION} found in CHANGELOG.md"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public              # no NODE_AUTH_TOKEN here — OIDC handles it

      - name: Tag and create GitHub Release
        if: github.event_name == 'push'               # manual test runs must not tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists, skipping"
          else
            gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "Release v${VERSION}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
